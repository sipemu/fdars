name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - 'fdars-core/**'
      - '.github/workflows/rust-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'fdars-core/**'
      - '.github/workflows/rust-ci.yml'
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable, beta, nightly]
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fdars-core/target/
          key: ${{ runner.os }}-cargo-${{ matrix.rust }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests (all features except dhat-heap)
        # Explicit list excludes dhat-heap: that feature activates a #[global_allocator]
        # in tests/alloc_audit_fpca.rs which panics ("A profiler already exists") when
        # multiple dhat tests run in parallel. The js feature is WASM-only (tested in
        # the dedicated wasm job). Run dhat tests manually: cargo test --features dhat-heap
        run: cargo test --features linalg,parallel,serde

      - name: Run tests (sequential mode)
        run: cargo test --no-default-features --features linalg

  determinism-guardrail:
    name: Determinism Guardrail
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            fdars-core/target/
          key: ${{ runner.os }}-cargo-determinism-${{ hashFiles('**/Cargo.lock') }}

      # Guardrail for the Phase 90 golden flake (co_cluster / svd_sign bit-identity).
      # Catch INTERMITTENT nondeterminism: a regression that only sometimes reproduces
      # surfaces within a handful of full parallel runs. dhat-heap is excluded (its
      # #[global_allocator] panics under parallel dhat tests); js is WASM-only.
      - name: Repeated full parallel run (intermittency)
        run: |
          for i in 1 2 3; do
            echo "=== determinism run $i/3 ==="
            cargo test --features linalg,parallel,serde 2>&1 | tee /tmp/dg_$i.log
            if grep -q "test result: FAILED" /tmp/dg_$i.log; then
              echo "RUN $i had a FAILED test result"; exit 1
            fi
          done
          echo ALL_3_RUNS_GREEN

      # Catch PARALLEL-REDUCTION-ORDER sensitivity: if any golden ever depended on
      # rayon reduction order, forcing single-threaded reduction would drift it.
      - name: Single-threaded reduction-order run
        run: |
          RAYON_NUM_THREADS=1 cargo test --features linalg,parallel,serde 2>&1 | tee /tmp/dg_st.log
          if grep -q "test result: FAILED" /tmp/dg_st.log; then
            echo "single-threaded run had a FAILED test result"; exit 1
          fi
          echo SINGLE_THREADED_GREEN

      # Anti-silent-skip: assert the faer-backend golden tests actually RAN under
      # linalg (not silently `ignored` by a cfg-guard / feature-wiring regression —
      # the exact Phase 90 failure surface).
      - name: Assert golden tests actually ran (anti-silent-skip)
        run: |
          cargo test --features linalg,parallel --test equivalence_phase48 -- golden_co_cluster 2>&1 | tee /tmp/dg_p48.log
          grep -Eq "test result: ok\. 2 passed; 0 failed; 0 ignored" /tmp/dg_p48.log \
            || { echo "phase48 co_cluster goldens did not run as expected (silently ignored?)"; exit 1; }
          echo PHASE48_GOLDENS_RAN
          cargo test --features linalg,parallel --test equivalence_phase49 -- svd_sign_fpca_two_matrix_bit_identical 2>&1 | tee /tmp/dg_p49.log
          grep -Eq "test result: ok\. 1 passed; 0 failed; 0 ignored" /tmp/dg_p49.log \
            || { echo "phase49 svd_sign golden did not run as expected (silently ignored?)"; exit 1; }
          echo PHASE49_GOLDEN_RAN

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Run clippy
        # Explicit feature list excludes dhat-heap (parallel-profiler panic risk) and
        # js (WASM-only; covered by the wasm job).
        run: cargo clippy --all-targets --features linalg,parallel,serde -- -D warnings -A clippy::too_many_arguments -A clippy::useless_vec -A clippy::type_complexity -A clippy::manual_memcpy -A clippy::wildcard_in_or_patterns

  fmt:
    name: Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check format
        run: cargo fmt --all -- --check

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build docs
        # Explicit feature list excludes dhat-heap and js (WASM-only).
        run: cargo doc --no-deps --features linalg,parallel,serde
        env:
          RUSTDOCFLAGS: -Dwarnings

  wasm:
    name: WASM Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Build for WASM (no default features)
        run: cargo build --target wasm32-unknown-unknown --no-default-features

      - name: Build for WASM (with js feature)
        run: cargo build --target wasm32-unknown-unknown --no-default-features --features js

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        # Explicit feature list excludes dhat-heap (parallel-profiler panic risk) and
        # js (WASM-only). Run dhat profiling separately: cargo test --features dhat-heap
        run: cargo llvm-cov --features linalg,parallel,serde --lcov --output-path lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: fdars-core/lcov.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [test, clippy, fmt, docs, wasm, determinism-guardrail]
    if: github.event_name == 'release' && github.event.action == 'published'
    defaults:
      run:
        working-directory: fdars-core
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}
